name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_TOKEN not set; skipping publish"
            exit 0
          fi
          for c in ferrum-reconciler ferrum-styling \
                   ferrum-testing ferrum-rs-router ferrum-data ferrum-ssr \
                   ferrum-native ferrum-lazy ferrum-components ferrum-security \
                   ferrum-registry ferrum-devtools ferrum-web ferrum-framework \
                   ferrum-ui-core ferrum-ui; do
            echo "publishing $c"
            cargo publish -p "$c" --token "$CARGO_REGISTRY_TOKEN" || exit 1
            sleep 5
          done

name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    if: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    runs-on: ubuntu-latest
    # Dependency order matters: publish one crate at a time.
    max-parallel: 1
    strategy:
      matrix:
        crate:
          - ferrum-macro
          - ferrum-core
          - ferrum-reconciler
          - ferrum-styling
          - ferrum-testing
          - ferrum-router
          - ferrum-data
          - ferrum-ssr
          - ferrum-native
          - ferrum-lazy
          - ferrum-components
          - ferrum-security
          - ferrum-registry
          - ferrum-devtools
          - ferrum-web
          - ferrum
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo publish ${{ matrix.crate }}
        run: cargo publish -p ${{ matrix.crate }} --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
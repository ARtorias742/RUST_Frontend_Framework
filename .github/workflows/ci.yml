name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --workspace
      - name: Conformance gate
        run: cargo test -p ferrum-conformance -- --nocapture
      - name: Security
        run: cargo test -p ferrum-security

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build examples
        run: cargo build --workspace --target wasm32-unknown-unknown
      - name: Size budget
        run: |
          cargo build --release --target wasm32-unknown-unknown -p example-showcase
          scripts/check-size.sh

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Benchmarks
        run: cargo bench -p ferrum-bench

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        working-directory: e2e
        run: npm install && npx playwright install --with-deps
      - name: DevTools + visual suite
        working-directory: e2e
        run: npm test

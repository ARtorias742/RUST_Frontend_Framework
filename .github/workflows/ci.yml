name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deny --locked
      - run: cargo deny check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: Conformance gate
        run: cargo test -p ferrum-conformance -- --nocapture
      - name: Security
        run: cargo test -p ferrum-security

  wasm-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-pack --locked
      - name: wasm-bindgen tests (Chrome + Firefox)
        run: wasm-pack test --headless --chrome --firefox crates/ferrum-web

  wasm-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --target wasm32-unknown-unknown
      - name: Size budget
        run: |
          cargo build --release --target wasm32-unknown-unknown -p example-showcase
          scripts/check-size.sh

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench -p ferrum-bench

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install trunk --locked
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Build example
        run: |
          cd examples/devtools
          trunk build --dist "$GITHUB_WORKSPACE/target/e2e"
      - name: Serve + Playwright
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps
          python3 -m http.server 8080 --directory "$GITHUB_WORKSPACE/target/e2e" &
          sleep 1
          FERRUM_BASE_URL=http://localhost:8080 npm run test:devtools

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - name: Sanitize (60s)
        working-directory: fuzz
        run: cargo fuzz run sanitize -- -max_total_time=60
      - name: SSR (60s)
        working-directory: fuzz
        run: cargo fuzz run ssr -- -max_total_time=60
      - name: Reconciler (60s)
        working-directory: fuzz
        run: cargo fuzz run reconciler -- -max_total_time=60

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Build Next.js site
        working-directory: website-next
        run: |
          npm install --no-audit --no-fund
          npm run build

  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Typecheck + package extension
        working-directory: vscode-extension
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
          npm run package

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install mdbook --locked
      - run: mdbook build website
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/book


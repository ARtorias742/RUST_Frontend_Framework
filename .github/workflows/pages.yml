name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install mdbook --locked
      - run: cargo install trunk --locked
      - name: Docs
        run: mdbook build website
      - name: Demo app
        run: |
          cd examples/realworld
          trunk build --release --dist "$GITHUB_WORKSPACE/target/pages/demo"
      - name: Assemble
        run: |
          mkdir -p target/pages/docs
          cp -r website/book/. target/pages/docs/
          cat > target/pages/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><title>Ferrum 0.1 alpha</title></head>
          <body style="font-family:system-ui;max-width:640px;margin:3rem auto;padding:0 1rem">
            <h1>Ferrum</h1>
            <p>A Rust frontend framework. <strong>0.1.0-alpha — not production-ready.</strong></p>
            <p><a href="docs/">Documentation</a> · <a href="demo/">Live demo (task board)</a></p>
          </body>
          </html>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/pages

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
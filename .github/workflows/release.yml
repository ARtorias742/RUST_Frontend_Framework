name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --workspace

      - name: Build demo wasm
        run: cargo build --release --target wasm32-unknown-unknown -p example-realworld

      - name: Size budget
        run: scripts/check-size.sh target/wasm32-unknown-unknown/release/example_realworld.wasm 200

      - name: SBOM
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cargo run -q -p ferrum-cli -- release --version "$VERSION" --sbom-only

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build VS Code extension
        working-directory: vscode-extension
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm run package

      - name: Collect artifacts
        run: |
          mkdir -p release-artifacts
          cp target/wasm32-unknown-unknown/release/example_realworld.wasm release-artifacts/
          cp target/sbom/*.cdx.json release-artifacts/
          cp vscode-extension/*.vsix release-artifacts/
          (cd release-artifacts && sha256sum * > ../checksums.txt)

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            checksums.txt
            release-artifacts/*